@media(max-width:900px){.app{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:8px}.brandbox{display:none}.nav{white-space:nowrap}.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.top{padding:10px 12px}section{padding:14px}}

<script>
const LOGO_URL=""; // coloque aqui o endereço da imagem da logomarca
const SUPABASE_URL="https://gnvvuegpiicrizbtqphb.supabase.co";
const SUPABASE_KEY="sb_publishable_z0iD8ZkM4fcO6EPmipeDUw_QoAV-Gwk";

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const iso=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
const d=n=>{const x=new Date();x.setHours(12);x.setDate(x.getDate()+n);return iso(x)};
const T=d(0),CM=T.slice(0,7),uid=()=>Math.random().toString(36).slice(2,8);
const fd=s=>s?s.slice(8)+'/'+s.slice(5,7)+'/'+s.slice(2,4):'—';
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const sum=a=>a.reduce((x,l)=>x+l.v,0),R=l=>l.t==='R',D=l=>l.t==='D';

function seed(){
 const L=(t,desc,v,obra,etapa,cc,cat,p,conta,cm,venc,pg,emp='e1')=>({id:uid(),t,desc,v,obra,etapa,emp,cc,cat,p,conta,comp:d(cm).slice(0,7),venc:d(venc),pg:pg===''?'':d(pg)});
 return{emp:[{id:'e1',nome:'Construtora'},{id:'e2',nome:'Fazenda Café'}],
 contas:[{id:'b1',nome:'Itaú Construtora',emp:'e1',saldo:80000},{id:'b2',nome:'Sicoob Fazenda',emp:'e2',saldo:45000},{id:'b3',nome:'Caixa da obra',emp:'e1',saldo:3000}],
 cc:[{id:'k1',nome:'Obras – Materiais',emp:'e1'},{id:'k2',nome:'Obras – Mão de obra',emp:'e1'},{id:'k3',nome:'Colheita de café',emp:'e2'},{id:'k4',nome:'Insumos agrícolas',emp:'e2'},{id:'k5',nome:'Administrativo',emp:'e1'},{id:'k6',nome:'Receitas de obra',emp:'e1'}],
 cat:[{id:'g1',nome:'Materiais'},{id:'g2',nome:'Mão de obra'},{id:'g3',nome:'Insumos'},{id:'g4',nome:'Serviços'},{id:'g5',nome:'Medições / vendas'},{id:'g6',nome:'Venda de café'}],
 forn:[{id:'f1',nome:'Cimento Forte',doc:'',tel:''},{id:'f2',nome:'Casa do Aço',doc:'',tel:''},{id:'f3',nome:'Eletro Sul',doc:'',tel:''},{id:'f4',nome:'Agro Insumos',doc:'',tel:''},{id:'f5',nome:'Empreiteira Silva',doc:'',tel:''}],
 cli:[{id:'c1',nome:'Família Almeida',doc:'',tel:''},{id:'c2',nome:'Clínica Vida',doc:'',tel:''},{id:'c3',nome:'Cooperativa do Café',doc:'',tel:''}],
 obras:[{id:'o1',nome:'Residencial Aurora',emp:'e1',cli:'c1',contrato:850000,etapas:[{id:'t1',nome:'Fundação',orc:90000},{id:'t2',nome:'Estrutura',orc:180000},{id:'t3',nome:'Alvenaria',orc:120000},{id:'t4',nome:'Acabamento',orc:200000}]},
  {id:'o2',nome:'Reforma Clínica Vida',emp:'e1',cli:'c2',contrato:220000,etapas:[{id:'t5',nome:'Demolição',orc:15000},{id:'t6',nome:'Elétrica',orc:40000},{id:'t7',nome:'Acabamento',orc:90000}]}],
 l:[L('R','Medição 1 – Aurora',150000,'o1','t1','k6','g5','c1','b1',-60,-55,-55),L('R','Medição 2 – Aurora',200000,'o1','t2','k6','g5','c1','b1',-30,-20,-20),L('R','Medição 3 – Aurora',180000,'o1','t3','k6','g5','c1','b1',0,8,''),
  L('R','Sinal – Clínica Vida',66000,'o2','t5','k6','g5','c2','b1',-30,-25,-25),L('R','Venda de café – safra',90000,'','','k3','g6','c3','b2',0,12,'','e2'),
  L('D','Cimento – fundação',48000,'o1','t1','k1','g1','f1','b1',-60,-58,-58),L('D','Aço – fundação',50000,'o1','t1','k1','g1','f2','b1',-60,-50,-50),
  L('D','Concreto – estrutura',92000,'o1','t2','k1','g1','f1','b1',-30,-18,-18),L('D','Aço – estrutura',61000,'o1','t2','k1','g1','f2','b1',-30,-3,''),
  L('D','Empreiteira – alvenaria',54000,'o1','t3','k2','g2','f5','b1',0,5,''),L('D','Materiais elétricos',27000,'o2','t6','k1','g1','f3','b1',-30,-10,-10),
  L('D','Demolição',14000,'o2','t5','k2','g2','f5','b1',-30,-24,-24),L('D','Adubo – lavoura',32000,'','','k4','g3','f4','b2',0,7,'','e2'),L('D','Diaristas – colheita',28000,'','','k3','g2','f5','b2',0,10,'','e2'),L('D','Contabilidade',6500,'','','k5','g4','','b1',0,15,'')]}}
let DB={emp:[],contas:[],cc:[],cat:[],forn:[],cli:[],obras:[],l:[]};
let V='dash',OB=null,F={q:'',t:'',s:''},CURRENT_USER=null;

async function loadDB(){
 const [emp,contas,cc,cat,forn,cli,obras,etapas,l]=await Promise.all([
  sb.from('empresas').select('*').order('id'), sb.from('contas').select('*').order('id'),
  sb.from('centros_custo').select('*').order('id'), sb.from('categorias').select('*').order('id'),
  sb.from('fornecedores').select('*').order('id'), sb.from('clientes').select('*').order('id'),
  sb.from('obras').select('*').order('id'), sb.from('etapas_obra').select('*').order('id'),
  sb.from('lancamentos').select('*').order('id')]);
 const all=[emp,contas,cc,cat,forn,cli,obras,etapas,l]; const er=all.find(x=>x.error); if(er) throw er.error;
 DB.emp=emp.data.map(x=>({id:String(x.id),nome:x.nome}));
 DB.contas=contas.data.map(x=>({id:String(x.id),nome:x.nome,emp:String(x.empresa_id||''),saldo:+x.saldo_inicial||0}));
 DB.cc=cc.data.map(x=>({id:String(x.id),nome:x.nome,emp:String(x.empresa_id||'')}));
 DB.cat=cat.data.map(x=>({id:String(x.id),nome:x.nome}));
 DB.forn=forn.data.map(x=>({id:String(x.id),nome:x.nome,doc:x.documento||'',tel:x.telefone||''}));
 DB.cli=cli.data.map(x=>({id:String(x.id),nome:x.nome,doc:x.documento||'',tel:x.telefone||''}));
 const es=etapas.data.map(x=>({id:String(x.id),obra:String(x.obra_id),nome:x.nome,orc:+x.valor_orcado||0}));
 DB.obras=obras.data.map(x=>({id:String(x.id),nome:x.nome,emp:String(x.empresa_id||''),cli:String(x.cliente_id||''),contrato:+x.valor_contrato||0,etapas:es.filter(e=>e.obra===String(x.id))}));
 DB.l=l.data.map(x=>({id:String(x.id),t:x.tipo,desc:x.descricao,v:+x.valor||0,obra:String(x.obra_id||''),etapa:String(x.etapa_id||''),emp:String(x.empresa_id||''),cc:String(x.centro_custo_id||''),cat:String(x.categoria_id||''),p:String((x.tipo==='D'?x.fornecedor_id:x.cliente_id)||''),conta:String(x.conta_id||''),comp:x.competencia?x.competencia.slice(0,7):'',venc:x.vencimento||'',pg:x.pagamento||''}));
}
const nnum=v=>v?Number(v):null;
async function saveAll(){ await loadDB(); render(); }
const commit=()=>render();

const nm=(a,id)=>(DB[a].find(x=>x.id===id)||{}).nome||'—';
const parte=l=>nm(l.t==='D'?'forn':'cli',l.p);
const st=l=>l.pg?'Pago':(l.venc<T?'Vencido':'Aberto');
const saldo=c=>c.saldo+DB.l.filter(l=>l.conta===c.id&&l.pg).reduce((a,l)=>a+(R(l)?l.v:-l.v),0);
const cost=(o,e)=>sum(DB.l.filter(l=>D(l)&&l.obra===o.id&&(!e||l.etapa===e)));
function oi(o){const orc=o.etapas.reduce((a,e)=>a+e.orc,0),rows=o.etapas.map(e=>{const r=cost(o,e.id);return{...e,r,dif:e.orc-r,pct:e.orc?r/e.orc*100:0}});
 const real=cost(o),sem=real-rows.reduce((a,e)=>a+e.r,0),proj=rows.reduce((a,e)=>a+Math.max(e.orc,e.r),0)+sem;
 return{orc,rows,real,sem,mp:o.contrato?(o.contrato-orc)/o.contrato*100:0,ma:o.contrato?(o.contrato-proj)/o.contrato*100:0}}
const chip=(t,c)=>`<span class="chip ${c}">${esc(t)}</span>`;
const sc=s=>s==='Pago'?'ok':s==='Vencido'?'bad':'wr';
const pc=v=>v.toFixed(1).replace('.',',')+'%';
const kpi=(l,v,s,c='')=>`<div class="card kpi"><span>${l}</span><b class="${c}">${v}</b><span>${s}</span></div>`;
const tbl=(h,r,e='Nada por aqui ainda.')=>r.length?`<div class="wrap"><table><tr>${h.map(x=>`<th class="${x[0]=='>'?'v':''}">${x.replace('>','')}</th>`).join('')}</tr>${r.join('')}</table></div>`:`<p class="mu">${e}</p>`;

/* ---------- views ---------- */
function dash(){
 const ab=DB.l.filter(l=>!l.pg),mes=DB.l.filter(l=>l.comp===CM),rec=sum(mes.filter(R)),des=sum(mes.filter(D)),res=rec-des,caixa=DB.contas.reduce((a,c)=>a+saldo(c),0);
 const ms=[...Array(6)].map((_,i)=>{const x=new Date();x.setHours(12);x.setDate(1);x.setMonth(x.getMonth()-5+i);return iso(x).slice(0,7)});
 const fx=ms.map(m=>({m,i:sum(DB.l.filter(l=>R(l)&&l.pg.startsWith(m))),o:sum(DB.l.filter(l=>D(l)&&l.pg.startsWith(m)))})),mx=Math.max(1,...fx.flatMap(x=>[x.i,x.o]));
 const chart=`<svg viewBox="0 0 600 190" style="width:100%">${fx.map((x,i)=>{const X=i*100+22,hi=x.i/mx*140,ho=x.o/mx*140;return `<rect x="${X}" y="${150-hi}" width="26" height="${hi}" rx="4" fill="var(--ok)"/><rect x="${X+30}" y="${150-ho}" width="26" height="${ho}" rx="4" fill="var(--bad)"/><text x="${X+28}" y="172" text-anchor="middle" font-size="12" fill="var(--mu)">${new Date(x.m+'-15').toLocaleDateString('pt-BR',{month:'short'})}</text>`}).join('')}</svg><span class="chip ok">Entradas</span> <span class="chip bad">Saídas</span> <span class="mu">(por data de pagamento)</span>`;
 const al=[];const venc=ab.filter(l=>l.venc<T);
 if(venc.length)al.push(`<div class="al bad" data-a="fv">● ${venc.length} conta(s) vencida(s) somando ${brl(sum(venc))}</div>`);
 DB.contas.filter(c=>saldo(c)<0).forEach(c=>al.push(`<div class="al bad" data-a="go:banc">● Saldo negativo em ${esc(c.nome)}</div>`));
 DB.obras.forEach(o=>{const i=oi(o);i.rows.filter(e=>e.r>e.orc).forEach(e=>al.push(`<div class="al wr" data-a="ob:${o.id}">▲ ${esc(o.nome)} · ${esc(e.nome)}: ${brl(-e.dif)} acima do orçamento (${Math.round(e.pct)}%)</div>`));
  if(i.ma<i.mp-0.05)al.push(`<div class="al wr" data-a="ob:${o.id}">▲ ${esc(o.nome)}: margem projetada caiu de ${pc(i.mp)} para ${pc(i.ma)}</div>`)});
 const prox=ab.sort((a,b)=>a.venc.localeCompare(b.venc)).slice(0,6);
 return `<div class="hd"><div><h1>Dashboard</h1><span class="mu">Visão geral de hoje · ${fd(T)}</span></div></div>
 <div class="grid g4">${kpi('Caixa disponível',brl(caixa),DB.contas.length+' conta(s)/caixa(s)',caixa<0?'bad':'pt')}${kpi('Contas a pagar',brl(sum(ab.filter(D))),ab.filter(D).length+' em aberto','bad')}${kpi('Contas a receber',brl(sum(ab.filter(R))),ab.filter(R).length+' em aberto','ok')}${kpi('Resultado do mês',brl(res),'Receitas '+brl(rec)+' · Despesas '+brl(des),res<0?'bad':'ok')}</div>
 <div class="grid g2"><div class="card"><h2>Fluxo de caixa</h2>${chart}</div><div class="card"><h2>Alertas</h2>${al.join('')||'<div class="al ok">● Tudo em dia.</div>'}</div></div>
 <div class="grid g2"><div class="card"><h2>Obras: orçado x realizado</h2>${DB.obras.map(o=>{const i=oi(o),p=i.orc?i.real/i.orc*100:0;return `<div data-a="ob:${o.id}" style="cursor:pointer;margin-bottom:14px"><b>${esc(o.nome)}</b> <span class="mu" style="float:right">${brl(i.real)} de ${brl(i.orc)}</span><div class="bar"><i class="${p>100?'bad':''}" style="width:${Math.min(p,100)}%"></i></div></div>`}).join('')||'<p class="mu">Nenhuma obra cadastrada.</p>'}</div>
 <div class="card"><h2>Próximos vencimentos</h2>${tbl(['Venc.','Descrição','>Valor'],prox.map(l=>`<tr><td>${fd(l.venc)}</td><td>${esc(l.desc)}<small>${esc(parte(l))}</small></td><td class="v ${R(l)?'ok':'bad'}">${R(l)?'+':'−'}${brl(l.v)}<small>${st(l)}</small></td></tr>`),'Nenhum vencimento em aberto.')}</div></div>`}

function ltab(){
